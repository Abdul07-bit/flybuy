<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,300..500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/bg.css">
<title>FAQ | FLYBUY</title>
</head><body>
<div id="toastHost"></div>
<header class="site-header" id="siteHeader"></header>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="cartDrawer" aria-label="Shopping cart"></div>
<main><div class="container"><div class="simple-page">
  <h1 class="display">Frequently <em>asked.</em></h1>
  <div id="faqRoot"></div>
</div></div></main>
<footer class="site-footer" id="siteFooter"></footer>
<button class="chat-fab" id="chatFab" aria-label="Open FLYBUY Assist"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
<div class="chat-panel" id="chatPanel" role="dialog" aria-label="FLYBUY Assist"></div>
<script src="js/utils.js"></script><script src="js/products.js"></script>
<script src="js/cart.js"></script><script src="js/components.js"></script>
<script src="js/cursor.js"></script><script src="js/motion.js"></script>
<script src="js/pages.js"></script><script src="js/search.js"></script>
<script src="js/account.js"></script><script src="js/checkout.js"></script><script src="js/bg.js"></script>
<script>
  const groups = {};
  FAQS.forEach(function(f){ (groups[f[0]] = groups[f[0]] || []).push([f[1], f[2]]); });
  document.getElementById('faqRoot').innerHTML = Object.entries(groups).map(function(g){
    return '<h3 style="margin:26px 0 6px;color:var(--color-blue);font-size:13px;text-transform:uppercase;letter-spacing:.05em">' + g[0] + '</h3>'
      + g[1].map(function(qa){
        return '<div class="accordion-item"><button class="accordion-head" onclick="this.parentElement.classList.toggle(\'open\')">' + qa[0]
          + '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>'
          + '<div class="accordion-body">' + qa[1] + '</div></div>';
      }).join('');
  }).join('');
</script>
</body></html>
